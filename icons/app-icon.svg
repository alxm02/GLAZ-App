<?xml version="1.0" encoding="UTF-8"?>
<!--
  App-Icon der GLAZ-Korrekturbuchungsliste: Dienstreise-Auto in Seitenansicht.

  Bewusst als kraeftige Silhouette ohne feine Details gezeichnet - die
  Windows-Taskleiste rendert das Icon je nach Skalierung mit 16 bis 32 px,
  und alles Feingliedrige verschwindet dort zu Matsch. Farben, Radien und
  die helle Lichtkante folgen dem Styleguide der Anwendung (siehe
  docs/Design-Konzept-v2.md): tiefblauer Grund, Cyan #00BEDC als Akzent.

  Quelle fuer build/icon.ico und glaz/resources/icons/app-icon.ico -
  beide werden mit build/icon_bauen.py aus dieser Datei erzeugt.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14304E"/>
      <stop offset="0.55" stop-color="#0A1A2C"/>
      <stop offset="1" stop-color="#060E1A"/>
    </linearGradient>
    <linearGradient id="karosserie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CF2FF"/>
      <stop offset="0.42" stop-color="#00BEDC"/>
      <stop offset="1" stop-color="#0086A3"/>
    </linearGradient>
    <linearGradient id="scheibe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D2A42"/>
      <stop offset="1" stop-color="#071626"/>
    </linearGradient>
    <radialGradient id="schein" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00BEDC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00BEDC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#grund)"/>
  <rect x="2.5" y="2.5" width="251" height="251" rx="55.5" fill="none"
        stroke="#9FE3F0" stroke-opacity="0.20" stroke-width="5"/>

  <ellipse cx="128" cy="190" rx="98" ry="30" fill="url(#schein)"/>

  <g transform="translate(128,124) scale(0.9) translate(-128,-128)">
    <path d="M26 172 L26 140 C26 132 32 126 40 125 L76 121
             C88 120 94 116 101 107 L117 88 C122 82 128 79 136 79
             L170 79 C179 79 186 82 191 89 L208 116 L224 121
             C232 124 236 130 236 138 L236 162 C236 168 232 172 226 172 Z"
          fill="url(#karosserie)"/>

    <path d="M108 112 L122 92 C125 88 129 86 134 86 L150 86 L150 112 Z" fill="url(#scheibe)"/>
    <path d="M158 86 L169 86 C175 86 179 88 182 92 L196 112 L158 112 Z" fill="url(#scheibe)"/>

    <rect x="225" y="134" width="12" height="12" rx="5" fill="#EAFDFF"/>

    <circle cx="76" cy="172" r="31" fill="#0A1A2C"/>
    <circle cx="192" cy="172" r="31" fill="#0A1A2C"/>
    <circle cx="76" cy="172" r="26" fill="url(#karosserie)"/>
    <circle cx="192" cy="172" r="26" fill="url(#karosserie)"/>
    <circle cx="76" cy="172" r="10" fill="#071626"/>
    <circle cx="192" cy="172" r="10" fill="#071626"/>
  </g>

  <g fill="#00BEDC" fill-opacity="0.45">
    <rect x="34" y="206" width="52" height="8" rx="4"/>
    <rect x="102" y="206" width="52" height="8" rx="4"/>
    <rect x="170" y="206" width="52" height="8" rx="4"/>
  </g>
</svg>
